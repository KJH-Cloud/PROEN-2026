<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R25E2514 · 个人主页</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 18px;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            color: #20243a;
            background: radial-gradient(circle at 12% 12%, #dce7ff, transparent 34%),
                        radial-gradient(circle at 90% 88%, #eadfff, transparent 32%), #f6f7fc;
        }
        .profile {
            width: min(100%, 860px);
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: clamp(28px, 6vw, 60px);
            padding: clamp(24px, 5vw, 54px);
            border: 1px solid rgba(255, 255, 255, .9);
            border-radius: 28px;
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 24px 70px rgba(46, 57, 105, .14);
        }
        .intro { text-align: left; }
        .label {
            display: inline-block;
            margin: 0 0 18px;
            padding: 8px 13px;
            border-radius: 999px;
            background: #eef0ff;
            color: #5b68c8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
        }
        h1 {
            margin: 0;
            font-size: clamp(34px, 5vw, 50px);
            line-height: 1.2;
            letter-spacing: -.04em;
        }
        h1 span { display: block; color: #6572d8; }
        .welcome {
            margin: 20px 0 0;
            color: #697086;
            font-size: 17px;
            line-height: 1.8;
        }
        .identity {
            display: inline-block;
            margin-top: 26px;
            padding: 10px 15px;
            border: 1px solid #e5e8f3;
            border-radius: 12px;
            color: #414969;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .1em;
        }
        .portrait {
            margin: 0;
            padding: 12px;
            border-radius: 22px;
            background: linear-gradient(145deg, #e5eaff, #f2e6ff);
        }
        .portrait img {
            display: block;
            width: 100%;
            max-height: 400px;
            border-radius: 15px;
            object-fit: cover;
        }
        .footer {
            grid-column: 1 / -1;
            margin: -18px 0 0;
            color: #9298aa;
            font-size: 12px;
            text-align: center;
        }
        @media (max-width: 620px) {
            .profile { grid-template-columns: 1fr; gap: 28px; border-radius: 22px; }
            .intro { text-align: center; }
            .portrait { width: min(100%, 380px); margin: auto; }
            .portrait img { max-height: 340px; }
            .footer { margin-top: -4px; }
        }
    </style>
</head>
<body>
    <main class="profile">
        <section class="intro">
            <p class="label">PERSONAL PROFILE</p>
            <h1>My profile<span>自我介绍</span></h1>
            <p class="welcome">Hello, I am R25E2514。<br>很高兴认识你！</p>
            <p class="welcome">In my leisure time, I enjoy watching films and cycling for travel. In the future, I hope to gain admission to a graduate school, continue my studies, and achieve my goals.</p>
            <div class="identity">R25E2514</div>
        </section>
        <figure class="portrait">
            <img src="ChatGPT 图像 2026年10月6日 12_04_44.png" alt="R25E2514 的个人照片">
        </figure>
        <p class="footer">欢迎来到我的个人主页</p>
    </main>
</body>
</html>
